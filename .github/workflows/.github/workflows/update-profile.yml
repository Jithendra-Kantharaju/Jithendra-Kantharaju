name: Update profile images

on:
  workflow_dispatch:

  schedule:
    - cron: "23 6 * * *"

  push:
    paths:
      - ".github/workflows/update-profile.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: update-profile-images
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Create image directory
        run: mkdir -p profile

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide_border=true&bg_color=0F172A&title_color=06B6D4&icon_color=8B5CF6&text_color=CBD5E1&disable_animations=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate language card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=0F172A&title_color=06B6D4&text_color=CBD5E1&disable_animations=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?color_snake=%238B5CF6
            profile/snake-dark.svg?palette=github-dark&color_snake=%2306B6D4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated SVG files
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = [
              "stats.svg",
              "top-langs.svg",
              "snake.svg",
              "snake-dark.svg",
          ]

          for filename in expected:
              path = Path("profile") / filename

              if not path.is_file() or path.stat().st_size == 0:
                  raise RuntimeError(f"Missing or empty image: {path}")

              root = ET.parse(path).getroot()

              if root.tag != "{http://www.w3.org/2000/svg}svg":
                  raise RuntimeError(f"Invalid SVG document: {path}")

              print(f"Validated: {path}")

      - name: Commit and push generated images
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            profile/stats.svg \
            profile/top-langs.svg \
            profile/snake.svg \
            profile/snake-dark.svg

          if git diff --cached --quiet; then
            echo "Profile images are already up to date."
            exit 0
          fi

          git commit -m "Update profile images"
          git pull --rebase origin "$PROFILE_BRANCH"
          git push origin "HEAD:$PROFILE_BRANCH"
        env:
          PROFILE_BRANCH: ${{ github.event.repository.default_branch }}
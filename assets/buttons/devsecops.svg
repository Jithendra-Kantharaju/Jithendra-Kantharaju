<svg xmlns="http://www.w3.org/2000/svg" width="280" height="54" viewBox="0 0 280 54" role="img" aria-label="VIEW DEVSECOPS">
  <defs><linearGradient id="lg"><stop stop-color="#102848"/><stop offset="1" stop-color="#1B1741"/></linearGradient></defs>
  <style>
  .title{font:700 17px ui-monospace,Consolas,monospace;fill:#EDF5FF}
  .min{font:600 10px ui-monospace,Consolas,monospace;fill:#32E6F2}
  .arr{animation:arrow 2.2s ease-in-out infinite}
  .dash{stroke-dasharray:9 10;animation:dash 5s linear infinite}
  @keyframes arrow{0%,100%{transform:translateX(0);opacity:.7}50%{transform:translateX(7px);opacity:1}}
  @keyframes dash{to{stroke-dashoffset:-120}}
  @media(prefers-reduced-motion:reduce){.arr,.dash{animation:none;transform:none}}
  .btn-shield{animation:bshield 3s ease-in-out infinite}@keyframes bshield{50%{opacity:.3;stroke-width:3}}
</style>
  <rect x="1" y="1" width="278" height="52" rx="12" fill="url(#lg)" stroke="#465A94"/>
  <path d="M16 45H263" stroke="#32E6F2" stroke-width="1.4" class="dash"/>
  <circle cx="27" cy="24" r="12" fill="#213658" stroke="#32E6F2" stroke-opacity=".6"/>
  <path d="M22 24 L26 28 33 20" fill="none" stroke="#32E6F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="49" y="17" class="min">REPOSITORY</text>
  <text x="49" y="36" class="title">VIEW DEVSECOPS</text>
  <g class="arr" opacity=".25"><path d="M243 19 L254 27 243 35" stroke="#32E6F2" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
  <g class="btn-custom"><path d="M249 14 L258 18 V28 Q257 38 249 42 Q241 38 240 28 V18Z" fill="none" stroke="#FDA5CF" stroke-width="1.4" class="btn-shield"/></g></svg>

<svg xmlns="http://www.w3.org/2000/svg"
     width="280" height="54"
     viewBox="0 0 280 54"
     role="img"
     aria-label="Email Jithendra Kantharaju">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100%" y2="0">
      <stop stop-color="#102848"/>
      <stop offset="1" stop-color="#241735"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="100%" y2="0">
      <stop stop-color="#FF9B9B"/>
      <stop offset=".5" stop-color="#F4A8CF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family:ui-monospace,Consolas,Menlo,monospace;
    }

    .title {
      font-size:17px;
      font-weight:800;
      fill:#F2F8FF;
    }

    .label {
      font-size:9px;
      font-weight:600;
      letter-spacing:.8px;
      fill:#E2B7D3;
    }

    .border {
      animation:border-glow 4.5s ease-in-out infinite;
    }

    @keyframes border-glow {
      0%,100% { stroke-opacity:.45; }
      50% { stroke-opacity:1; }
    }

    .mail {
      animation:mail-pulse 3.2s ease-in-out infinite;
    }

    @keyframes mail-pulse {
      0%,100% { opacity:.65; }
      50% { opacity:1; }
    }

    .envelope-detail {
      stroke-dasharray:32;
      animation:draw-envelope 4s ease-in-out infinite;
    }

    @keyframes draw-envelope {
      0%,15% { stroke-dashoffset:32; }
      55%,85% { stroke-dashoffset:0; }
      100% { stroke-dashoffset:32; }
    }

    .underline {
      stroke-dasharray:45 22;
      animation:move-line 5.4s linear infinite;
    }

    @keyframes move-line {
      to { stroke-dashoffset:-268; }
    }

    .status {
      animation:status-pulse 3s ease-in-out infinite;
    }

    @keyframes status-pulse {
      0%,100% { opacity:.35; }
      50% { opacity:1; }
    }

    @media(prefers-reduced-motion:reduce) {
      .border,.mail,.envelope-detail,
      .underline,.status {
        animation:none!important;
      }
      .envelope-detail {
        stroke-dashoffset:0!important;
      }
    }
  </style>

  <!-- Button background -->

  <rect x="1" y="1"
        width="278" height="52"
        rx="12"
        fill="url(#bg)"
        stroke="#A47AA0"
        class="border"/>

  <!-- Email icon background -->

  <rect x="14" y="11"
        width="34" height="32"
        rx="8"
        fill="#3A294D"
        stroke="#F4A8CF"
        stroke-opacity=".65"
        class="mail"/>

  <!-- Professional envelope icon -->

  <rect x="19.5" y="19"
        width="23" height="17"
        rx="3"
        fill="#33233F"
        stroke="#FFD0DB"
        stroke-width="1.7"/>

  <path d="M21 22L31 29L41 22"
        fill="none"
        stroke="#FFB3CA"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="envelope-detail"/>

  <!-- Mail seal -->

  <circle cx="31" cy="29"
          r="2"
          fill="#FF9B9B"
          class="mail"/>

  <!-- Button text -->

  <text x="62" y="19"
        class="mono label">
    CONTACT /
  </text>

  <text x="62" y="37"
        class="mono title">
    EMAIL ME
  </text>

  <!-- Status indicator -->

  <circle cx="256" cy="26"
          r="6"
          fill="#42243F"
          stroke="#FFB3CA"
          stroke-opacity=".55"/>

  <circle cx="256" cy="26"
          r="2.8"
          fill="#FF9B9B"
          class="status"/>

  <!-- Bottom accent -->

  <path d="M15 47H265"
        stroke="#6D4965"
        stroke-width="1"
        stroke-opacity=".7"/>

  <path d="M15 47H265"
        stroke="url(#line)"
        stroke-width="1.6"
        class="underline"/>

</svg>

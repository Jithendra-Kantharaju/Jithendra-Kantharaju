
<svg xmlns="http://www.w3.org/2000/svg"
     width="280" height="54"
     viewBox="0 0 280 54"
     role="img"
     aria-label="Visit Jithendra Kantharaju's portfolio website">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100%" y2="0">
      <stop stop-color="#102848"/>
      <stop offset="1" stop-color="#142E34"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="100%" y2="0">
      <stop stop-color="#31E7F4"/>
      <stop offset=".5" stop-color="#64E6C1"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family:ui-monospace,Consolas,Menlo,monospace;
    }

    .title {
      font-size:17px;
      font-weight:800;
      fill:#F2F8FF;
    }

    .label {
      font-size:9px;
      font-weight:600;
      letter-spacing:.8px;
      fill:#9DDCCC;
    }

    .border {
      animation:border-glow 4.5s ease-in-out infinite;
    }

    @keyframes border-glow {
      0%,100% { stroke-opacity:.45; }
      50% { stroke-opacity:1; }
    }

    .globe-ring {
      transform-box:fill-box;
      transform-origin:center;
      animation:globe-rotate 8s linear infinite;
    }

    @keyframes globe-rotate {
      0% { transform:scaleX(1); }
      25% { transform:scaleX(.35); }
      50% { transform:scaleX(-1); }
      75% { transform:scaleX(.35); }
      100% { transform:scaleX(1); }
    }

    .globe-glow {
      animation:globe-glow 4s ease-in-out infinite;
    }

    @keyframes globe-glow {
      0%,100% { opacity:.5; }
      50% { opacity:1; }
    }

    .underline {
      stroke-dasharray:45 22;
      animation:move-line 5s linear infinite;
    }

    @keyframes move-line {
      to { stroke-dashoffset:-268; }
    }

    .status {
      animation:status-pulse 2.8s ease-in-out infinite;
    }

    @keyframes status-pulse {
      0%,100% { opacity:.4; }
      50% { opacity:1; }
    }

    @media(prefers-reduced-motion:reduce) {
      .border,.globe-ring,.globe-glow,
      .underline,.status {
        animation:none!important;
      }
    }
  </style>

  <!-- Button background -->

  <rect x="1" y="1"
        width="278" height="52"
        rx="12"
        fill="url(#bg)"
        stroke="#4C9D9E"
        class="border"/>

  <!-- Portfolio icon background -->

  <rect x="14" y="11"
        width="34" height="32"
        rx="8"
        fill="#123A41"
        stroke="#64E6C1"
        stroke-opacity=".65"
        class="globe-glow"/>

  <!-- Professional globe icon -->

  <circle cx="31" cy="27"
          r="11"
          fill="none"
          stroke="#B2FFE7"
          stroke-width="1.6"/>

  <!-- Latitude -->

  <path d="M20 27H42"
        fill="none"
        stroke="#64E6C1"
        stroke-width="1.3"/>

  <path d="M22 21.5
           Q31 25 40 21.5
           M22 32.5
           Q31 29 40 32.5"
        fill="none"
        stroke="#64E6C1"
        stroke-width="1.1"
        stroke-opacity=".75"/>

  <!-- Animated longitude -->

  <g class="globe-ring">
    <ellipse cx="31" cy="27"
             rx="5.5" ry="11"
             fill="none"
             stroke="#B2FFE7"
             stroke-width="1.3"/>
  </g>

  <!-- Button text -->

  <text x="62" y="19"
        class="mono label">
    EXPLORE /
  </text>

  <text x="62" y="37"
        class="mono title">
    PORTFOLIO
  </text>

  <!-- Status indicator -->

  <circle cx="256" cy="26"
          r="6"
          fill="#143D42"
          stroke="#64E6C1"
          stroke-opacity=".6"/>

  <circle cx="256" cy="26"
          r="2.8"
          fill="#64E6C1"
          class="status"/>

  <!-- Bottom accent -->

  <path d="M15 47H265"
        stroke="#3B6465"
        stroke-width="1"
        stroke-opacity=".65"/>

  <path d="M15 47H265"
        stroke="url(#line)"
        stroke-width="1.6"
        class="underline"/>

</svg>

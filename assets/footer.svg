<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="237" viewBox="0 0 1200 237" role="img" aria-label="Jithendra Kantharaju. Let us solve hard problems. Build, automate, verify.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080F24"/><stop offset=".68" stop-color="#111633"/><stop offset="1" stop-color="#170F38"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#32E6F2"/><stop offset=".55" stop-color="#6198FB"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#6146C3" stop-opacity=".35"/><stop offset="1" stop-color="#6146C3" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6B86C9" stroke-opacity=".085"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  
</defs>
<style>
  .mono{font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace}
  .sans{font-family: 'Segoe UI', Arial, Helvetica, sans-serif}
  .head{font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-weight:800}
  .fade{animation:appear 1.25s ease both}
  .pulse{animation:pulse 4s ease-in-out infinite}
  @keyframes appear{from{opacity:1; transform:translateY(9px)}to{opacity:1; transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.95}}
  @media (prefers-reduced-motion: reduce){.fade,.pulse{animation:none}}


  /* GitHub-compatible, native SVG motion. No scripts, remote fonts, or JS. */
  .kin-in{animation:kin-in 980ms cubic-bezier(.16,1,.3,1) both}
  .kin-glow{animation:kin-glow 5.2s ease-in-out infinite}
  .kin-nudge{animation:kin-nudge 5s ease-in-out infinite}
  .kin-dash{stroke-dasharray:9 15;animation:kin-dash 9s linear infinite}
  .kin-ring{transform-box:fill-box;transform-origin:center;animation:kin-ring 4.6s ease-in-out infinite}
  .kin-rail{animation:kin-rail 2.3s ease-in-out infinite}
  @keyframes kin-in{0%{opacity:1;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes kin-glow{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes kin-nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes kin-dash{to{stroke-dashoffset:-288}}
  @keyframes kin-ring{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:1;transform:scale(1.10)}}
  @keyframes kin-rail{0%,100%{opacity:.55}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    .kin-in,.kin-glow,.kin-nudge,.kin-dash,.kin-ring,.kin-rail{animation:none!important;opacity:1!important;transform:none!important}
    .kin-moving{display:none!important}
  }

/* Custom motion for footer.svg */
.twinkle{animation:twinkle 4s ease-in-out infinite}@keyframes twinkle{0%,100%{opacity:.18;transform:scale(.6)}45%{opacity:1;transform:scale(1.2)}}@media(prefers-reduced-motion:reduce){.twinkle{animation:none}}
</style>
<rect width="1200" height="237" rx="18" fill="url(#bg)"/>
<rect width="1200" height="237" rx="18" fill="url(#grid)"/>
<rect x=".8" y=".8" width="1198.4" height="235.4" rx="17.5" fill="none" stroke="#65A4FF" stroke-opacity=".20"/>
<ellipse cx="1000" cy="30" rx="330" ry="200" fill="url(#aura)" class="kin-glow"/>
<text x="58" y="64" font-family="mono" class="mono kin-in" font-size="13" font-weight="650" fill="#32E6F2" style="animation-delay:0.16s">OPEN TO DEVOPS, CLOUD, SRE, FDE AND AI ENGINEERING ROLES</text>
<text x="55" y="117" font-family="head" class="head kin-in" font-size="43" font-weight="760" fill="#ECF4FF" style="animation-delay:0.27s">Let’s solve hard problems.</text>
<text x="58" y="157" font-family="sans" class="sans kin-in" font-size="18" font-weight="400" fill="#9DB0D0" style="animation-delay:0.38s">I build infrastructure that scales and AI workflows that stay accountable.</text>
<path d="M57 187 H1144" stroke="url(#accent)" stroke-width="2"/>
<text x="58" y="215" font-family="mono" class="mono kin-in" font-size="12" font-weight="500" fill="#9DB0D0" style="animation-delay:0.49s">JITHENDRA KANTHARAJU  /  BUILD • AUTOMATE • VERIFY</text>

<g class="kin-moving"><circle cx="56" cy="187" r="5" fill="#32E6F2"><animate attributeName="cx" values="56;1145" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle></g><g class="footer-stars"><circle cx="898" cy="100" r="3" fill="#32E6F2" class="twinkle" style="animation-delay:0.0s"/><circle cx="947" cy="119" r="4" fill="#A78BFA" class="twinkle" style="animation-delay:0.42s"/><circle cx="996" cy="100" r="5" fill="#FF9585" class="twinkle" style="animation-delay:0.84s"/><circle cx="1045" cy="119" r="3" fill="#32E6F2" class="twinkle" style="animation-delay:1.26s"/><circle cx="1094" cy="100" r="4" fill="#A78BFA" class="twinkle" style="animation-delay:1.68s"/><circle cx="1143" cy="119" r="5" fill="#FF9585" class="twinkle" style="animation-delay:2.1s"/></g>
</svg>
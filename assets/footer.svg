<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="237" viewBox="0 0 1200 237" role="img" aria-label="Jithendra Kantharaju. Let us solve hard problems. Build, automate, verify.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080F24"/><stop offset=".68" stop-color="#111633"/><stop offset="1" stop-color="#170F38"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#32E6F2"/><stop offset=".55" stop-color="#6198FB"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#6146C3" stop-opacity=".35"/><stop offset="1" stop-color="#6146C3" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6B86C9" stroke-opacity=".085"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  
</defs>
<style>
  .mono{font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace}
  .sans{font-family: 'Segoe UI', Arial, Helvetica, sans-serif}
  .head{font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-weight:800}
  .fade{animation:appear 1.25s ease both}
  .pulse{animation:pulse 4s ease-in-out infinite}
  @keyframes appear{from{opacity:0; transform:translateY(9px)}to{opacity:1; transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.95}}
  @media (prefers-reduced-motion: reduce){.fade,.pulse{animation:none}}
</style>
<rect width="1200" height="237" rx="18" fill="url(#bg)"/>
<rect width="1200" height="237" rx="18" fill="url(#grid)"/>
<rect x=".8" y=".8" width="1198.4" height="235.4" rx="17.5" fill="none" stroke="#65A4FF" stroke-opacity=".20"/>
<ellipse cx="1000" cy="30" rx="330" ry="200" fill="url(#aura)"/>
<text x="58" y="64" font-family="mono" class="mono" font-size="13" font-weight="650" fill="#32E6F2" >OPEN TO DEVOPS, CLOUD, SRE, FDE AND AI ENGINEERING ROLES</text>
<text x="55" y="117" font-family="head" class="head" font-size="43" font-weight="760" fill="#ECF4FF" >Let’s solve hard problems.</text>
<text x="58" y="157" font-family="sans" class="sans" font-size="18" font-weight="400" fill="#9DB0D0" >I build infrastructure that scales and AI workflows that stay accountable.</text>
<path d="M57 187 H1144" stroke="url(#accent)" stroke-width="2"/>
<text x="58" y="215" font-family="mono" class="mono" font-size="12" font-weight="500" fill="#9DB0D0" >JITHENDRA KANTHARAJU  /  BUILD • AUTOMATE • VERIFY</text>

</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="378" viewBox="0 0 1200 378" role="img" aria-label="Four professional certifications: AWS Solutions Architect Associate, AWS AI Practitioner, Google Cloud Associate Cloud Engineer, Claude Certified Architect Foundations.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080F24"/><stop offset=".68" stop-color="#111633"/><stop offset="1" stop-color="#170F38"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#32E6F2"/><stop offset=".55" stop-color="#6198FB"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#6146C3" stop-opacity=".35"/><stop offset="1" stop-color="#6146C3" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6B86C9" stroke-opacity=".085"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  
</defs>
<style>
  .mono{font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace}
  .sans{font-family: 'Segoe UI', Arial, Helvetica, sans-serif}
  .head{font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-weight:800}
  .fade{animation:appear 1.25s ease both}
  .pulse{animation:pulse 4s ease-in-out infinite}
  @keyframes appear{from{opacity:1; transform:translateY(9px)}to{opacity:1; transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.95}}
  @media (prefers-reduced-motion: reduce){.fade,.pulse{animation:none}}


  /* GitHub-compatible, native SVG motion. No scripts, remote fonts, or JS. */
  .kin-in{animation:kin-in 980ms cubic-bezier(.16,1,.3,1) both}
  .kin-glow{animation:kin-glow 5.2s ease-in-out infinite}
  .kin-nudge{animation:kin-nudge 5s ease-in-out infinite}
  .kin-dash{stroke-dasharray:9 15;animation:kin-dash 9s linear infinite}
  .kin-ring{transform-box:fill-box;transform-origin:center;animation:kin-ring 4.6s ease-in-out infinite}
  .kin-rail{animation:kin-rail 2.3s ease-in-out infinite}
  @keyframes kin-in{0%{opacity:1;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes kin-glow{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes kin-nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes kin-dash{to{stroke-dashoffset:-288}}
  @keyframes kin-ring{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:1;transform:scale(1.10)}}
  @keyframes kin-rail{0%,100%{opacity:.55}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    .kin-in,.kin-glow,.kin-nudge,.kin-dash,.kin-ring,.kin-rail{animation:none!important;opacity:1!important;transform:none!important}
    .kin-moving{display:none!important}
  }

/* Custom motion for certifications.svg */
.cert-seal{animation:cert-seal 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes cert-seal{0%,100%{opacity:.55}45%{opacity:1;filter:drop-shadow(0 0 5px #7DAAF4)}}@media(prefers-reduced-motion:reduce){.cert-seal{animation:none}}
</style>
<rect width="1200" height="378" rx="18" fill="url(#bg)"/>
<rect width="1200" height="378" rx="18" fill="url(#grid)"/>
<rect x=".8" y=".8" width="1198.4" height="376.4" rx="17.5" fill="none" stroke="#65A4FF" stroke-opacity=".20"/>
<ellipse cx="960" cy="60" rx="260" ry="190" fill="url(#aura)" class="kin-glow"/><rect x="40" y="35" width="555" height="145" rx="15" fill="#101C39" stroke="#3B517B" stroke-opacity=".55"/><rect x="58" y="55" rx="9" width="75" height="58" fill="#182F50" stroke="#32E6F2" stroke-opacity=".55"/><text x="96" y="92" font-family="mono" class="mono kin-in" font-size="21" font-weight="750" fill="#32E6F2" text-anchor="middle" style="animation-delay:0.16s">AWS</text><text x="153" y="79" font-family="head" class="head kin-in" font-size="21" font-weight="720" fill="#ECF4FF" style="animation-delay:0.27s">SOLUTIONS ARCHITECT</text><text x="153" y="107" font-family="mono" class="mono kin-in" font-size="17" font-weight="600" fill="#A78BFA" style="animation-delay:0.38s">ASSOCIATE</text><text x="153" y="146" font-family="sans" class="sans kin-in" font-size="15" font-weight="400" fill="#9DB0D0" style="animation-delay:0.49s">Amazon Web Services  ·  2026</text><rect x="625" y="35" width="555" height="145" rx="15" fill="#101C39" stroke="#3B517B" stroke-opacity=".55"/><rect x="643" y="55" rx="9" width="75" height="58" fill="#182F50" stroke="#32E6F2" stroke-opacity=".55"/><text x="681" y="92" font-family="mono" class="mono kin-in" font-size="21" font-weight="750" fill="#32E6F2" text-anchor="middle" style="animation-delay:0.60s">AWS</text><text x="738" y="79" font-family="head" class="head kin-in" font-size="21" font-weight="720" fill="#ECF4FF" style="animation-delay:0.71s">AI PRACTITIONER</text><text x="738" y="107" font-family="mono" class="mono" font-size="17" font-weight="600" fill="#A78BFA">CERTIFICATION</text><text x="738" y="146" font-family="sans" class="sans" font-size="15" font-weight="400" fill="#9DB0D0">Amazon Web Services  ·  2026</text><rect x="40" y="197" width="555" height="145" rx="15" fill="#101C39" stroke="#3B517B" stroke-opacity=".55"/><rect x="58" y="217" rx="9" width="75" height="58" fill="#182F50" stroke="#32E6F2" stroke-opacity=".55"/><text x="96" y="254" font-family="mono" class="mono" font-size="21" font-weight="750" fill="#32E6F2" text-anchor="middle">GCP</text><text x="153" y="241" font-family="head" class="head" font-size="21" font-weight="720" fill="#ECF4FF">ASSOCIATE CLOUD</text><text x="153" y="269" font-family="mono" class="mono" font-size="17" font-weight="600" fill="#A78BFA">ENGINEER</text><text x="153" y="308" font-family="sans" class="sans" font-size="15" font-weight="400" fill="#9DB0D0">Google Cloud  ·  2026</text><rect x="625" y="197" width="555" height="145" rx="15" fill="#101C39" stroke="#3B517B" stroke-opacity=".55"/><rect x="643" y="217" rx="9" width="75" height="58" fill="#182F50" stroke="#32E6F2" stroke-opacity=".55"/><text x="681" y="254" font-family="mono" class="mono" font-size="21" font-weight="750" fill="#32E6F2" text-anchor="middle">AI</text><text x="738" y="241" font-family="head" class="head" font-size="21" font-weight="720" fill="#ECF4FF">CLAUDE CERTIFIED</text><text x="738" y="269" font-family="mono" class="mono" font-size="17" font-weight="600" fill="#A78BFA">ARCHITECT · FOUNDATIONS</text><text x="738" y="308" font-family="sans" class="sans" font-size="15" font-weight="400" fill="#9DB0D0">Anthropic  ·  2026</text>
<g class="kin-moving"><rect x="42" y="37" rx="2" width="75" height="3" fill="#32E6F2"><animate attributeName="width" values="35;105;35" dur="5s" begin="0.0s" repeatCount="indefinite"/></rect><rect x="627" y="37" rx="2" width="75" height="3" fill="#A78BFA"><animate attributeName="width" values="35;105;35" dur="5s" begin="0.8s" repeatCount="indefinite"/></rect><rect x="42" y="199" rx="2" width="75" height="3" fill="#32E6F2"><animate attributeName="width" values="35;105;35" dur="5s" begin="1.6s" repeatCount="indefinite"/></rect><rect x="627" y="199" rx="2" width="75" height="3" fill="#A78BFA"><animate attributeName="width" values="35;105;35" dur="5s" begin="2.4s" repeatCount="indefinite"/></rect></g><g class="cert-seals"><g transform="translate(548 90)" class="cert-seal" style="animation-delay:0.0s"><circle r="23" fill="#132541" stroke="#7CDBFF" stroke-width="1.6" stroke-dasharray="3 5"/><path d="M-10 0 L-3 7 12 -11" fill="none" stroke="#7CDBFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(1135 90)" class="cert-seal" style="animation-delay:0.37s"><circle r="23" fill="#132541" stroke="#BC9BFF" stroke-width="1.6" stroke-dasharray="3 5"/><path d="M-10 0 L-3 7 12 -11" fill="none" stroke="#BC9BFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(548 254)" class="cert-seal" style="animation-delay:0.74s"><circle r="23" fill="#132541" stroke="#74DDC1" stroke-width="1.6" stroke-dasharray="3 5"/><path d="M-10 0 L-3 7 12 -11" fill="none" stroke="#74DDC1" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(1135 254)" class="cert-seal" style="animation-delay:1.1099999999999999s"><circle r="23" fill="#132541" stroke="#F7B16D" stroke-width="1.6" stroke-dasharray="3 5"/><path d="M-10 0 L-3 7 12 -11" fill="none" stroke="#F7B16D" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g></g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="474" viewBox="0 0 1200 474" role="img" aria-label="Skills: AWS, GCP, Azure, Terraform, Ansible, ArgoCD, Jenkins, GitHub Actions, Kubernetes, LangGraph, LLM agents, PostgreSQL, Prometheus, security.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080F24"/><stop offset=".68" stop-color="#111633"/><stop offset="1" stop-color="#170F38"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#32E6F2"/><stop offset=".55" stop-color="#6198FB"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#6146C3" stop-opacity=".35"/><stop offset="1" stop-color="#6146C3" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6B86C9" stroke-opacity=".085"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  
</defs>
<style>
  .mono{font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace}
  .sans{font-family: 'Segoe UI', Arial, Helvetica, sans-serif}
  .head{font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-weight:800}
  .fade{animation:appear 1.25s ease both}
  .pulse{animation:pulse 4s ease-in-out infinite}
  @keyframes appear{from{opacity:1; transform:translateY(9px)}to{opacity:1; transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.95}}
  @media (prefers-reduced-motion: reduce){.fade,.pulse{animation:none}}


  /* GitHub-compatible, native SVG motion. No scripts, remote fonts, or JS. */
  .kin-in{animation:kin-in 980ms cubic-bezier(.16,1,.3,1) both}
  .kin-glow{animation:kin-glow 5.2s ease-in-out infinite}
  .kin-nudge{animation:kin-nudge 5s ease-in-out infinite}
  .kin-dash{stroke-dasharray:9 15;animation:kin-dash 9s linear infinite}
  .kin-ring{transform-box:fill-box;transform-origin:center;animation:kin-ring 4.6s ease-in-out infinite}
  .kin-rail{animation:kin-rail 2.3s ease-in-out infinite}
  @keyframes kin-in{0%{opacity:1;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes kin-glow{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes kin-nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes kin-dash{to{stroke-dashoffset:-288}}
  @keyframes kin-ring{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:1;transform:scale(1.10)}}
  @keyframes kin-rail{0%,100%{opacity:.55}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    .kin-in,.kin-glow,.kin-nudge,.kin-dash,.kin-ring,.kin-rail{animation:none!important;opacity:1!important;transform:none!important}
    .kin-moving{display:none!important}
  }

/* Custom motion for tech-toolkit.svg */
.toolkit-led{animation:toolkit-led 3s ease-in-out infinite}@keyframes toolkit-led{0%,100%{opacity:.25;transform:scale(.75)}45%{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){.toolkit-led{animation:none}}
</style>
<rect width="1200" height="474" rx="18" fill="url(#bg)"/>
<rect width="1200" height="474" rx="18" fill="url(#grid)"/>
<rect x=".8" y=".8" width="1198.4" height="472.4" rx="17.5" fill="none" stroke="#65A4FF" stroke-opacity=".20"/>
<ellipse cx="900" cy="80" rx="260" ry="180" fill="url(#aura)" class="kin-glow"/><rect x="36" y="30" width="567" height="131" rx="15" fill="#101C39" stroke="#3B517B" stroke-opacity=".55"/><circle cx="63" cy="62" r="7" fill="#32E6F2"/><text x="83" y="67" font-family="mono" class="mono kin-in" font-size="17" font-weight="700" fill="#ECF4FF" style="animation-delay:0.16s">CLOUD / PLATFORM</text><text x="61" y="109" font-family="sans" class="sans kin-in" font-size="17" font-weight="400" fill="#9DB0D0" style="animation-delay:0.27s">AWS · EKS · ECS · EC2 · S3 · RDS</text><text x="61" y="135" font-family="sans" class="sans kin-in" font-size="16" font-weight="400" fill="#9DB0D0" style="animation-delay:0.38s">GCP · Azure · VPC · IAM</text><rect x="624" y="30" width="567" height="131" rx="15" fill="#101C39" stroke="#3B517B" stroke-opacity=".55"/><circle cx="651" cy="62" r="7" fill="#A78BFA"/><text x="671" y="67" font-family="mono" class="mono kin-in" font-size="17" font-weight="700" fill="#ECF4FF" style="animation-delay:0.49s">INFRASTRUCTURE / GITOPS</text><text x="649" y="109" font-family="sans" class="sans kin-in" font-size="17" font-weight="400" fill="#9DB0D0" style="animation-delay:0.60s">Terraform · CloudFormation · Ansible</text><text x="649" y="135" font-family="sans" class="sans kin-in" font-size="16" font-weight="400" fill="#9DB0D0" style="animation-delay:0.71s">Helm · ArgoCD · Kustomize</text><rect x="36" y="174" width="567" height="131" rx="15" fill="#101C39" stroke="#3B517B" stroke-opacity=".55"/><circle cx="63" cy="206" r="7" fill="#32E6F2"/><text x="83" y="211" font-family="mono" class="mono" font-size="17" font-weight="700" fill="#ECF4FF">BUILD / RELEASE</text><text x="61" y="253" font-family="sans" class="sans" font-size="17" font-weight="400" fill="#9DB0D0">GitHub Actions · Jenkins · GitLab CI</text><text x="61" y="279" font-family="sans" class="sans" font-size="16" font-weight="400" fill="#9DB0D0">Docker · Kubernetes · ECR</text><rect x="624" y="174" width="567" height="131" rx="15" fill="#101C39" stroke="#3B517B" stroke-opacity=".55"/><circle cx="651" cy="206" r="7" fill="#A78BFA"/><text x="671" y="211" font-family="mono" class="mono" font-size="17" font-weight="700" fill="#ECF4FF">AI / LLM SYSTEMS</text><text x="649" y="253" font-family="sans" class="sans" font-size="17" font-weight="400" fill="#9DB0D0">Python · LangGraph · LangChain · RAG</text><text x="649" y="279" font-family="sans" class="sans" font-size="16" font-weight="400" fill="#9DB0D0">OpenAI · Anthropic · Bedrock · FastAPI</text><rect x="36" y="318" width="567" height="131" rx="15" fill="#101C39" stroke="#3B517B" stroke-opacity=".55"/><circle cx="63" cy="350" r="7" fill="#32E6F2"/><text x="83" y="355" font-family="mono" class="mono" font-size="17" font-weight="700" fill="#ECF4FF">OBSERVABILITY / SECURITY</text><text x="61" y="397" font-family="sans" class="sans" font-size="17" font-weight="400" fill="#9DB0D0">Prometheus · Grafana · CloudWatch</text><text x="61" y="423" font-family="sans" class="sans" font-size="16" font-weight="400" fill="#9DB0D0">Vault · Trivy · OPA · Falco</text><rect x="624" y="318" width="567" height="131" rx="15" fill="#101C39" stroke="#3B517B" stroke-opacity=".55"/><circle cx="651" cy="350" r="7" fill="#A78BFA"/><text x="671" y="355" font-family="mono" class="mono" font-size="17" font-weight="700" fill="#ECF4FF">DATA / APPLICATIONS</text><text x="649" y="397" font-family="sans" class="sans" font-size="17" font-weight="400" fill="#9DB0D0">PostgreSQL · pgvector · ChromaDB</text><text x="649" y="423" font-family="sans" class="sans" font-size="16" font-weight="400" fill="#9DB0D0">Bash · SQL · React · REST APIs</text>
<g class="kin-moving"><circle cx="62" cy="195" r="4" fill="#32E6F2"><animate attributeName="opacity" values=".12;1;.12" dur="3.8s" begin="0.00s" repeatCount="indefinite"/></circle><circle cx="650" cy="195" r="4" fill="#32E6F2"><animate attributeName="opacity" values=".12;1;.12" dur="3.8s" begin="0.55s" repeatCount="indefinite"/></circle><circle cx="62" cy="350" r="4" fill="#32E6F2"><animate attributeName="opacity" values=".12;1;.12" dur="3.8s" begin="1.10s" repeatCount="indefinite"/></circle><circle cx="650" cy="350" r="4" fill="#32E6F2"><animate attributeName="opacity" values=".12;1;.12" dur="3.8s" begin="1.65s" repeatCount="indefinite"/></circle></g><g class="toolkit-signals"><path d="M518 61 h18" stroke="#42E6F1" stroke-width="2" stroke-opacity=".55"/><circle cx="545" cy="61" r="5" fill="#42E6F1" class="toolkit-led" style="animation-delay:0.00s"/><path d="M1101 61 h18" stroke="#C7A2FF" stroke-width="2" stroke-opacity=".55"/><circle cx="1128" cy="61" r="5" fill="#C7A2FF" class="toolkit-led" style="animation-delay:0.29s"/><path d="M518 205 h18" stroke="#77C1FA" stroke-width="2" stroke-opacity=".55"/><circle cx="545" cy="205" r="5" fill="#77C1FA" class="toolkit-led" style="animation-delay:0.58s"/><path d="M1101 205 h18" stroke="#9D8BFF" stroke-width="2" stroke-opacity=".55"/><circle cx="1128" cy="205" r="5" fill="#9D8BFF" class="toolkit-led" style="animation-delay:0.87s"/><path d="M518 349 h18" stroke="#67DEB1" stroke-width="2" stroke-opacity=".55"/><circle cx="545" cy="349" r="5" fill="#67DEB1" class="toolkit-led" style="animation-delay:1.16s"/><path d="M1101 349 h18" stroke="#F6B56B" stroke-width="2" stroke-opacity=".55"/><circle cx="1128" cy="349" r="5" fill="#F6B56B" class="toolkit-led" style="animation-delay:1.45s"/></g>
</svg>
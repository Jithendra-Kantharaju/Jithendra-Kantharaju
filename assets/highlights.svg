<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="306" viewBox="0 0 1200 306" role="img" aria-label="Selected verified metrics: 40 percent faster deployments, 70 percent less manual provisioning, 93.8 percent incident classification on mocked scenarios, zero unsafe auto approvals on 425 synthetic invoice cases.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080F24"/><stop offset=".68" stop-color="#111633"/><stop offset="1" stop-color="#170F38"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#32E6F2"/><stop offset=".55" stop-color="#6198FB"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#6146C3" stop-opacity=".35"/><stop offset="1" stop-color="#6146C3" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6B86C9" stroke-opacity=".085"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  
</defs>
<style>
  .mono{font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace}
  .sans{font-family: 'Segoe UI', Arial, Helvetica, sans-serif}
  .head{font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-weight:800}
  .fade{animation:appear 1.25s ease both}
  .pulse{animation:pulse 4s ease-in-out infinite}
  @keyframes appear{from{opacity:1; transform:translateY(9px)}to{opacity:1; transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.95}}
  @media (prefers-reduced-motion: reduce){.fade,.pulse{animation:none}}


  /* GitHub-compatible, native SVG motion. No scripts, remote fonts, or JS. */
  .kin-in{animation:kin-in 980ms cubic-bezier(.16,1,.3,1) both}
  .kin-glow{animation:kin-glow 5.2s ease-in-out infinite}
  .kin-nudge{animation:kin-nudge 5s ease-in-out infinite}
  .kin-dash{stroke-dasharray:9 15;animation:kin-dash 9s linear infinite}
  .kin-ring{transform-box:fill-box;transform-origin:center;animation:kin-ring 4.6s ease-in-out infinite}
  .kin-rail{animation:kin-rail 2.3s ease-in-out infinite}
  @keyframes kin-in{0%{opacity:1;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes kin-glow{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes kin-nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes kin-dash{to{stroke-dashoffset:-288}}
  @keyframes kin-ring{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:1;transform:scale(1.10)}}
  @keyframes kin-rail{0%,100%{opacity:.55}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    .kin-in,.kin-glow,.kin-nudge,.kin-dash,.kin-ring,.kin-rail{animation:none!important;opacity:1!important;transform:none!important}
    .kin-moving{display:none!important}
  }

/* Custom motion for highlights.svg */
.metric-bar{transform-box:fill-box;transform-origin:left;animation:metric-load 1.7s cubic-bezier(.16,1,.3,1) both}@keyframes metric-load{from{transform:scaleX(.08);opacity:.3}to{transform:scaleX(1);opacity:1}}.metric-verify{stroke-dasharray:34;animation:metric-check 3.5s ease-in-out infinite}@keyframes metric-check{0%{stroke-dashoffset:34}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:34}}@media(prefers-reduced-motion:reduce){.metric-bar,.metric-verify{animation:none}}
</style>
<rect width="1200" height="306" rx="18" fill="url(#bg)"/>
<rect width="1200" height="306" rx="18" fill="url(#grid)"/>
<rect x=".8" y=".8" width="1198.4" height="304.4" rx="17.5" fill="none" stroke="#65A4FF" stroke-opacity=".20"/>
<ellipse cx="1080" cy="20" rx="260" ry="160" fill="url(#aura)" class="kin-glow"/><rect x="43" y="43" width="274" height="218" rx="15" fill="#101C39" stroke="#3B517B" stroke-opacity=".55"/><rect x="58" y="57" width="49" height="4" rx="2" fill="url(#accent)"/><text x="64" y="130" font-family="head" class="head kin-in" font-size="56" font-weight="750" fill="#32E6F2" style="animation-delay:0.16s">40%</text><text x="63" y="179" font-family="mono" class="mono kin-in" font-size="14" font-weight="650" fill="#ECF4FF" style="animation-delay:0.27s">FASTER DEPLOYMENTS</text><text x="63" y="214" font-family="sans" class="sans kin-in" font-size="14" font-weight="400" fill="#9DB0D0" style="animation-delay:0.38s">Jenkins + GitLab CI</text><rect x="335" y="43" width="274" height="218" rx="15" fill="#101C39" stroke="#3B517B" stroke-opacity=".55"/><rect x="350" y="57" width="49" height="4" rx="2" fill="url(#accent)"/><text x="356" y="130" font-family="head" class="head kin-in" font-size="56" font-weight="750" fill="#A78BFA" style="animation-delay:0.49s">~70%</text><text x="355" y="179" font-family="mono" class="mono kin-in" font-size="14" font-weight="650" fill="#ECF4FF" style="animation-delay:0.60s">LESS MANUAL SETUP</text><text x="355" y="214" font-family="sans" class="sans kin-in" font-size="14" font-weight="400" fill="#9DB0D0" style="animation-delay:0.71s">Terraform + Ansible</text><rect x="627" y="43" width="274" height="218" rx="15" fill="#101C39" stroke="#3B517B" stroke-opacity=".55"/><rect x="642" y="57" width="49" height="4" rx="2" fill="url(#accent)"/><text x="648" y="130" font-family="head" class="head" font-size="56" font-weight="750" fill="#32E6F2">93.8%</text><text x="647" y="179" font-family="mono" class="mono" font-size="14" font-weight="650" fill="#ECF4FF">INCIDENT CLASSIFICATION</text><text x="647" y="214" font-family="sans" class="sans" font-size="14" font-weight="400" fill="#9DB0D0">15 of 16 mock scenarios</text><rect x="919" y="43" width="274" height="218" rx="15" fill="#101C39" stroke="#3B517B" stroke-opacity=".55"/><rect x="934" y="57" width="49" height="4" rx="2" fill="url(#accent)"/><text x="940" y="130" font-family="head" class="head" font-size="56" font-weight="750" fill="#A78BFA">0</text><text x="939" y="179" font-family="mono" class="mono" font-size="14" font-weight="650" fill="#ECF4FF">UNSAFE AUTO-APPROVALS</text><text x="939" y="214" font-family="sans" class="sans" font-size="14" font-weight="400" fill="#9DB0D0">425 synthetic invoice tests</text>
<g class="kin-moving"><rect x="54" y="60" height="3" width="28" rx="1.5" fill="#32E6F2"><animate attributeName="width" values="16;65;16" dur="4.2s" begin="0.00s" repeatCount="indefinite"/></rect><rect x="342" y="60" height="3" width="28" rx="1.5" fill="#32E6F2"><animate attributeName="width" values="16;65;16" dur="4.2s" begin="0.60s" repeatCount="indefinite"/></rect><rect x="630" y="60" height="3" width="28" rx="1.5" fill="#32E6F2"><animate attributeName="width" values="16;65;16" dur="4.2s" begin="1.20s" repeatCount="indefinite"/></rect><rect x="918" y="60" height="3" width="28" rx="1.5" fill="#32E6F2"><animate attributeName="width" values="16;65;16" dur="4.2s" begin="1.80s" repeatCount="indefinite"/></rect></g><g aria-label="Metric evidence indicators"><rect x="63" y="238" width="218" height="5" rx="2.5" fill="#2B3A57"/><rect x="63" y="238" width="85" height="5" rx="2.5" fill="#35E9EF" class="metric-bar" style="animation-delay:0.00s"/><rect x="355" y="238" width="218" height="5" rx="2.5" fill="#2B3A57"/><rect x="355" y="238" width="149" height="5" rx="2.5" fill="#A88AFF" class="metric-bar" style="animation-delay:0.22s"/><rect x="647" y="238" width="218" height="5" rx="2.5" fill="#2B3A57"/><rect x="647" y="238" width="200" height="5" rx="2.5" fill="#34D7C2" class="metric-bar" style="animation-delay:0.44s"/><path d="M948 236 L956 244 L971 227" stroke="#B99AFF" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="metric-verify"/><text x="985" y="244" fill="#B99AFF" font-family="monospace" font-size="11">REVIEWED</text></g>
</svg>
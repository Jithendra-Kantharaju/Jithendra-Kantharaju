<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="372" viewBox="0 0 1200 372" role="img" aria-label="LEDGERGUARD. AI-assisted invoice processing with policy checks, three-way matching, human approval and auditable decisions. 425 SYNTHETIC CASES: 0 WRONG AUTO-APPROVALS. Technologies: Python, LangGraph, FastAPI, PostgreSQL, AWS ECS">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080F24"/><stop offset=".68" stop-color="#111633"/><stop offset="1" stop-color="#170F38"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#32E6F2"/><stop offset=".55" stop-color="#6198FB"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#6146C3" stop-opacity=".35"/><stop offset="1" stop-color="#6146C3" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6B86C9" stroke-opacity=".085"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  
</defs>
<style>
  .mono{font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace}
  .sans{font-family: 'Segoe UI', Arial, Helvetica, sans-serif}
  .head{font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-weight:800}
  .fade{animation:appear 1.25s ease both}
  .pulse{animation:pulse 4s ease-in-out infinite}
  @keyframes appear{from{opacity:0; transform:translateY(9px)}to{opacity:1; transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.95}}
  @media (prefers-reduced-motion: reduce){.fade,.pulse{animation:none}}


  /* GitHub-compatible, native SVG motion. No scripts, remote fonts, or JS. */
  .kin-in{animation:kin-in 980ms cubic-bezier(.16,1,.3,1) both}
  .kin-glow{animation:kin-glow 5.2s ease-in-out infinite}
  .kin-nudge{animation:kin-nudge 5s ease-in-out infinite}
  .kin-dash{stroke-dasharray:9 15;animation:kin-dash 9s linear infinite}
  .kin-ring{transform-box:fill-box;transform-origin:center;animation:kin-ring 4.6s ease-in-out infinite}
  .kin-rail{animation:kin-rail 2.3s ease-in-out infinite}
  @keyframes kin-in{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes kin-glow{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes kin-nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes kin-dash{to{stroke-dashoffset:-288}}
  @keyframes kin-ring{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:1;transform:scale(1.10)}}
  @keyframes kin-rail{0%,100%{opacity:.55}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    .kin-in,.kin-glow,.kin-nudge,.kin-dash,.kin-ring,.kin-rail{animation:none!important;opacity:1!important;transform:none!important}
    .kin-moving{display:none!important}
  }
</style>
<rect width="1200" height="372" rx="18" fill="url(#bg)"/>
<rect width="1200" height="372" rx="18" fill="url(#grid)"/>
<rect x=".8" y=".8" width="1198.4" height="370.4" rx="17.5" fill="none" stroke="#65A4FF" stroke-opacity=".20"/>
<ellipse cx="1010" cy="80" rx="240" ry="190" fill="url(#aura)" class="kin-glow"/>
    <rect x="39" y="35" width="7" height="278" rx="3" fill="url(#accent)"/>
    <text x="71" y="69" font-family="mono" class="mono kin-in" font-size="14" font-weight="600" fill="#32E6F2" style="animation-delay:0.16s">01 / AI FINANCE AUTOMATION</text>
    <text x="70" y="119" font-family="head" class="head kin-in" font-size="34" font-weight="800" fill="#ECF4FF" style="animation-delay:0.27s">LEDGERGUARD</text>
    <text x="70" y="168" font-family="sans" class="sans kin-in" font-size="18" font-weight="400" fill="#9DB0D0" style="animation-delay:0.38s">AI-assisted invoice processing with policy checks, three-way</text>
    <text x="70" y="196" font-family="sans" class="sans kin-in" font-size="18" font-weight="400" fill="#9DB0D0" style="animation-delay:0.49s">matching, human approval and auditable decisions.</text>
    <text x="71" y="235" font-family="mono" class="mono kin-in" font-size="12" font-weight="650" fill="#A78BFA" style="animation-delay:0.60s">425 SYNTHETIC CASES</text>
    <text x="71" y="276" font-family="head" class="head kin-in" font-size="27" font-weight="750" fill="#32E6F2" style="animation-delay:0.71s">0 WRONG AUTO-APPROVALS</text>
    <path d="M70 298 H814" stroke="#324264"/>
    <g><rect x="70" y="310" width="70" height="32" rx="16" fill="#121F3C" stroke="#6E80D5" stroke-opacity=".42"/><text x="105.0" y="331" font-family="mono" class="mono" font-size="12" font-weight="500" fill="#C6D9F1" text-anchor="middle">Python</text></g><g><rect x="149" y="310" width="94" height="32" rx="16" fill="#121F3C" stroke="#6E80D5" stroke-opacity=".42"/><text x="196.0" y="331" font-family="mono" class="mono" font-size="12" font-weight="500" fill="#C6D9F1" text-anchor="middle">LangGraph</text></g><g><rect x="252" y="310" width="78" height="32" rx="16" fill="#121F3C" stroke="#6E80D5" stroke-opacity=".42"/><text x="291.0" y="331" font-family="mono" class="mono" font-size="12" font-weight="500" fill="#C6D9F1" text-anchor="middle">FastAPI</text></g><g><rect x="339" y="310" width="102" height="32" rx="16" fill="#121F3C" stroke="#6E80D5" stroke-opacity=".42"/><text x="390.0" y="331" font-family="mono" class="mono" font-size="12" font-weight="500" fill="#C6D9F1" text-anchor="middle">PostgreSQL</text></g><g><rect x="450" y="310" width="78" height="32" rx="16" fill="#121F3C" stroke="#6E80D5" stroke-opacity=".42"/><text x="489.0" y="331" font-family="mono" class="mono" font-size="12" font-weight="500" fill="#C6D9F1" text-anchor="middle">AWS ECS</text></g><rect x="855" y="70" width="303" height="245" rx="15" fill="#101C39" stroke="#3B517B" stroke-opacity=".55"/>
    <text x="876" y="99" font-family="mono" class="mono" font-size="12" font-weight="500" fill="#9DB0D0">SYSTEM / FLOW</text>
    <path d="M898 165 H1116" stroke="url(#accent)" stroke-width="2" stroke-dasharray="7 6" class="kin-dash"/>
    <circle cx="906" cy="165" r="18" fill="#142F4D" stroke="#32E6F2"/>
    <circle cx="989" cy="165" r="18" fill="#1E2149" stroke="#7E7BFC"/>
    <circle cx="1074" cy="165" r="18" fill="#2C2047" stroke="#A78BFA"/>
    <path d="M910 218 h164" stroke="#304A70" stroke-dasharray="3 8"/>
    <text x="906" y="253" font-family="mono" class="mono" font-size="12" font-weight="600" fill="#32E6F2" text-anchor="middle">REVIEW</text>
    <text x="989" y="253" font-family="mono" class="mono" font-size="12" font-weight="600" fill="#32E6F2" text-anchor="middle">MATCH</text>
    <text x="1074" y="253" font-family="mono" class="mono" font-size="12" font-weight="600" fill="#32E6F2" text-anchor="middle">DECIDE</text>
    
<g class="kin-moving"><circle cx="906" cy="165" r="24" fill="none" stroke="#32E6F2" stroke-opacity=".23" stroke-width="1.6"><animate attributeName="r" values="18;27;18" dur="4.5s" begin="0.00s" repeatCount="indefinite"/><animate attributeName="opacity" values=".12;.65;.12" dur="4.5s" begin="0.00s" repeatCount="indefinite"/></circle><circle cx="989" cy="165" r="24" fill="none" stroke="#8495FF" stroke-opacity=".23" stroke-width="1.6"><animate attributeName="r" values="18;27;18" dur="4.5s" begin="0.65s" repeatCount="indefinite"/><animate attributeName="opacity" values=".12;.65;.12" dur="4.5s" begin="0.65s" repeatCount="indefinite"/></circle><circle cx="1074" cy="165" r="24" fill="none" stroke="#A78BFA" stroke-opacity=".23" stroke-width="1.6"><animate attributeName="r" values="18;27;18" dur="4.5s" begin="1.30s" repeatCount="indefinite"/><animate attributeName="opacity" values=".12;.65;.12" dur="4.5s" begin="1.30s" repeatCount="indefinite"/></circle><circle cx="906" cy="165" r="4" fill="#F0F8FF"><animate attributeName="cx" values="906;989;1074;1074" keyTimes="0;.35;.7;1" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.68;1" dur="5s" repeatCount="indefinite"/></circle></g></svg>
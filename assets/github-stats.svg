<svg xmlns="http://www.w3.org/2000/svg"
  width="900" height="366" viewBox="0 0 900 366"
  role="img" aria-labelledby="title description">
  <title id="title">GitHub activity at a glance</title>
  <desc id="description">Jithendra-Kantharaju has 21 public repositories
    and 40 contributions in the last 12 months.</desc>

  <defs>
    <linearGradient id="bg" x2="100%" y2="100%">
      <stop stop-color="#080F24"/>
      <stop offset="1" stop-color="#1C1540"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: system-ui, sans-serif; }
    .heading { fill: #ECF4FF; font-size: 24px; font-weight: 700; }
    .label { fill: #C6B6F8; font-size: 17px; font-weight: 600; }
    .caption { fill: #B6C8E8; font-size: 15px; }
    .number { fill: #32E6F2; font-size: 36px; font-weight: 700; }
    @media (prefers-reduced-motion: no-preference) {
      .signal { animation: appear 1.4s ease-out both; }
    }
    @keyframes appear {
      from { opacity: .35; }
      to { opacity: 1; }
    }
  </style>

  <rect x=".5" y=".5" width="899" height="365" rx="17.5"
        fill="url(#bg)" stroke="#375181"/>
  <text x="28" y="43" class="heading">GitHub activity at a glance</text>
  <circle cx="864" cy="35" r="4" fill="#32E6F2" class="signal"/>

  
  <g transform="translate(28 62)">
    <rect width="415" height="110" rx="12" fill="#111D39" stroke="#344976"/>
    <text x="16" y="28" class="label">Public repositories</text>
    <text x="16" y="49" class="caption">GitHub account</text>
    <text x="16" y="92" class="number">21</text>
  </g>
  <g transform="translate(457 62)">
    <rect width="415" height="110" rx="12" fill="#111D39" stroke="#344976"/>
    <text x="16" y="28" class="label">Contributions</text>
    <text x="16" y="49" class="caption">Last 12 months</text>
    <text x="16" y="92" class="number">40</text>
  </g>

  <text x="28" y="199" class="label">Top primary languages by public repository count</text>
  
  <g transform="translate(0 223)">
    <text x="28" y="0" class="caption">Python</text>
    <rect x="176" y="-10" width="644" height="10" rx="5" fill="#1B2D4F"/>
    <rect x="176" y="-10" width="644"
          height="10" rx="5" fill="#32E6F2"/>
    <text x="872" y="0" text-anchor="end" class="caption">10</text>
  </g>
  <g transform="translate(0 247)">
    <text x="28" y="0" class="caption">JavaScript</text>
    <rect x="176" y="-10" width="644" height="10" rx="5" fill="#1B2D4F"/>
    <rect x="176" y="-10" width="129"
          height="10" rx="5" fill="#A78BFA"/>
    <text x="872" y="0" text-anchor="end" class="caption">2</text>
  </g>
  <g transform="translate(0 271)">
    <text x="28" y="0" class="caption">TypeScript</text>
    <rect x="176" y="-10" width="644" height="10" rx="5" fill="#1B2D4F"/>
    <rect x="176" y="-10" width="129"
          height="10" rx="5" fill="#32E6F2"/>
    <text x="872" y="0" text-anchor="end" class="caption">2</text>
  </g>
  <g transform="translate(0 295)">
    <text x="28" y="0" class="caption">Dockerfile</text>
    <rect x="176" y="-10" width="644" height="10" rx="5" fill="#1B2D4F"/>
    <rect x="176" y="-10" width="64"
          height="10" rx="5" fill="#A78BFA"/>
    <text x="872" y="0" text-anchor="end" class="caption">1</text>
  </g>
  <g transform="translate(0 319)">
    <text x="28" y="0" class="caption">HCL</text>
    <rect x="176" y="-10" width="644" height="10" rx="5" fill="#1B2D4F"/>
    <rect x="176" y="-10" width="64"
          height="10" rx="5" fill="#32E6F2"/>
    <text x="872" y="0" text-anchor="end" class="caption">1</text>
  </g>
  <text x="28" y="350" class="caption">Contribution data: 2026-11-14</text>
</svg>

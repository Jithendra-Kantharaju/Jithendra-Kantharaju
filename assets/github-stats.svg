<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="278" viewBox="0 0 1200 278" role="img" aria-label="Account statistics pending first successful GitHub Actions workflow run, with no fabricated numbers.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080F24"/><stop offset=".68" stop-color="#111633"/><stop offset="1" stop-color="#170F38"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#32E6F2"/><stop offset=".55" stop-color="#6198FB"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#6146C3" stop-opacity=".35"/><stop offset="1" stop-color="#6146C3" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6B86C9" stroke-opacity=".085"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  
</defs>
<style>
  .mono{font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace}
  .sans{font-family: 'Segoe UI', Arial, Helvetica, sans-serif}
  .head{font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-weight:800}
  .fade{animation:appear 1.25s ease both}
  .pulse{animation:pulse 4s ease-in-out infinite}
  @keyframes appear{from{opacity:1; transform:translateY(9px)}to{opacity:1; transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.95}}
  @media (prefers-reduced-motion: reduce){.fade,.pulse{animation:none}}


  /* GitHub-compatible, native SVG motion. No scripts, remote fonts, or JS. */
  .kin-in{animation:kin-in 980ms cubic-bezier(.16,1,.3,1) both}
  .kin-glow{animation:kin-glow 5.2s ease-in-out infinite}
  .kin-nudge{animation:kin-nudge 5s ease-in-out infinite}
  .kin-dash{stroke-dasharray:9 15;animation:kin-dash 9s linear infinite}
  .kin-ring{transform-box:fill-box;transform-origin:center;animation:kin-ring 4.6s ease-in-out infinite}
  .kin-rail{animation:kin-rail 2.3s ease-in-out infinite}
  @keyframes kin-in{0%{opacity:1;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes kin-glow{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes kin-nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes kin-dash{to{stroke-dashoffset:-288}}
  @keyframes kin-ring{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:1;transform:scale(1.10)}}
  @keyframes kin-rail{0%,100%{opacity:.55}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    .kin-in,.kin-glow,.kin-nudge,.kin-dash,.kin-ring,.kin-rail{animation:none!important;opacity:1!important;transform:none!important}
    .kin-moving{display:none!important}
  }

/* Custom motion for github-stats.svg */
.load-stats{animation:load-stats 3s ease-in-out infinite}@keyframes load-stats{0%,100%{opacity:.18;transform:scaleX(.35)}45%{opacity:.75;transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){.load-stats{animation:none}}
</style>
<rect width="1200" height="278" rx="18" fill="url(#bg)"/>
<rect width="1200" height="278" rx="18" fill="url(#grid)"/>
<rect x=".8" y=".8" width="1198.4" height="276.4" rx="17.5" fill="none" stroke="#65A4FF" stroke-opacity=".20"/>
<text x="56" y="71" font-family="mono" class="mono kin-in" font-size="15" font-weight="700" fill="#32E6F2" style="animation-delay:0.16s">GITHUB ACCOUNT SNAPSHOT</text>
<text x="56" y="128" font-family="head" class="head kin-in" font-size="32" font-weight="700" fill="#ECF4FF" style="animation-delay:0.27s">Live repository metrics</text>
<text x="56" y="174" font-family="sans" class="sans kin-in" font-size="19" font-weight="400" fill="#9DB0D0" style="animation-delay:0.38s">Generated from the GitHub API after the first workflow run.</text>
<g><rect x="57" y="207" width="200" height="32" rx="16" fill="#121F3C" stroke="#32E6F2" stroke-opacity=".42"/><text x="157.0" y="228" font-family="mono" class="mono kin-in" font-size="14" font-weight="500" fill="#B9E7F8" text-anchor="middle" style="animation-delay:0.49s">PUBLIC REPOSITORIES</text></g>
<g><rect x="279" y="207" width="177" height="32" rx="16" fill="#121F3C" stroke="#32E6F2" stroke-opacity=".42"/><text x="367.5" y="228" font-family="mono" class="mono kin-in" font-size="14" font-weight="500" fill="#B9E7F8" text-anchor="middle" style="animation-delay:0.60s">REPOSITORY STARS</text></g>
<g><rect x="478" y="207" width="125" height="32" rx="16" fill="#121F3C" stroke="#32E6F2" stroke-opacity=".42"/><text x="540.5" y="228" font-family="mono" class="mono kin-in" font-size="14" font-weight="500" fill="#B9E7F8" text-anchor="middle" style="animation-delay:0.71s">FOLLOWERS</text></g>
<g class="kin-moving"><circle cx="100" cy="258" r="3" fill="#32E6F2"><animate attributeName="opacity" values=".1;.75;.1" dur="4s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="340" cy="258" r="3" fill="#32E6F2"><animate attributeName="opacity" values=".1;.75;.1" dur="4s" begin="0.6s" repeatCount="indefinite"/></circle><circle cx="580" cy="258" r="3" fill="#32E6F2"><animate attributeName="opacity" values=".1;.75;.1" dur="4s" begin="1.1s" repeatCount="indefinite"/></circle><circle cx="820" cy="258" r="3" fill="#32E6F2"><animate attributeName="opacity" values=".1;.75;.1" dur="4s" begin="1.7s" repeatCount="indefinite"/></circle><circle cx="1060" cy="258" r="3" fill="#32E6F2"><animate attributeName="opacity" values=".1;.75;.1" dur="4s" begin="2.2s" repeatCount="indefinite"/></circle></g><g><text x="815" y="98" font-family="monospace" fill="#A78BFA" font-size="15">DATA SOURCE: GITHUB API</text><rect x="815" y="120" width="250" height="13" rx="6" fill="#3BE0E9" class="load-stats" style="animation-delay:0.0s"/><rect x="815" y="153" width="225" height="13" rx="6" fill="#AC91FA" class="load-stats" style="animation-delay:0.25s"/><rect x="815" y="186" width="200" height="13" rx="6" fill="#83C8F0" class="load-stats" style="animation-delay:0.5s"/><rect x="815" y="219" width="175" height="13" rx="6" fill="#3BE0E9" class="load-stats" style="animation-delay:0.75s"/></g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="104" viewBox="0 0 1200 104" role="img" aria-label="I build with AWS Kubernetes Terraform GitOps, LangGraph agents RAG Python, observability and security">
<defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#32E6F2"/><stop offset="1" stop-color="#A78BFA"/></linearGradient></defs>
<style>
.t{font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:21px;text-anchor:middle;fill:#DCF5FF;opacity:0;animation:show 12s linear infinite}
.t2{animation-delay:4s}.t3{animation-delay:8s}.scan{stroke-dasharray:15 16;animation:run 5s linear infinite}
@keyframes show{0%,2%{opacity:0}7%,28%{opacity:1}33.333%,100%{opacity:0}}
@keyframes run{to{stroke-dashoffset:-280}}
@media(prefers-reduced-motion:reduce){.t,.scan{animation:none}.t1{opacity:1}.t2,.t3{opacity:0}}

/* Custom motion for typing-focus.svg */
.blink{animation:blink .85s steps(1) infinite}@keyframes blink{50%{opacity:.1}}@media(prefers-reduced-motion:reduce){.blink{animation:none}.focus-pulse{display:none}}
</style>
<rect width="1200" height="104" rx="15" fill="#0A1530"/>
<rect x="1" y="1" width="1198" height="102" rx="14" fill="none" stroke="#395581"/>
<rect x="18" y="20" width="10" height="10" rx="5" fill="#32E6F2"/><rect x="37" y="20" width="10" height="10" rx="5" fill="#A78BFA"/><rect x="56" y="20" width="10" height="10" rx="5" fill="#537EBA"/>
<text x="92" y="30" fill="#719FCF" font-size="12" font-family="ui-monospace,Consolas,monospace">ENGINEERING FOCUS / 2026</text>
<text x="600" y="70" class="t t1">AWS   /   KUBERNETES   /   TERRAFORM   /   GITOPS</text>
<text x="600" y="70" class="t t2">LANGGRAPH   /   LLM AGENTS   /   RAG   /   PYTHON</text>
<text x="600" y="70" class="t t3">CI/CD   /   OBSERVABILITY   /   SECURITY   /   AUTOMATION</text>
<path d="M28 90 H1172" fill="none" stroke="url(#lg)" stroke-width="1.6" class="scan"/>
<g class="focus-pulse"><rect x="1123" y="53" width="3" height="20" rx="1" fill="#36E9EF" class="blink"/><circle cx="1145" cy="62" r="5" fill="#75EDB5"><animate attributeName="opacity" values="1;.2;1" dur="2.5s" repeatCount="indefinite"/></circle></g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg"
     width="720" height="318" viewBox="0 0 720 318"
     role="img" aria-labelledby="title">
  <title id="title">Jithendra Kantharaju. Cloud infrastructure. Reliable delivery. Applied AI.</title>

  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7DE5F2"/>
      <stop offset="100%" stop-color="#C6B6F8"/>
    </linearGradient>
  </defs>

  <style>
    @media (prefers-reduced-motion: no-preference) {
      .signal {
        animation: arrive 1.5s ease-out both;
      }
    }

    @keyframes arrive {
      from { opacity: 0.35; transform: translateX(-42px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>

  <rect x="0.5" y="0.5" width="719" height="317" rx="20"
        fill="#0B0E13" stroke="#283440"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <rect x="44" y="30" width="348" height="38" rx="19"
          fill="#10161C" stroke="#263B46"/>
    <circle cx="63" cy="49" r="4" fill="#7DE5F2"/>
    <text x="78" y="55" fill="#B8C3D1" font-size="17" font-weight="600">
      United States · Open to opportunities
    </text>

    <text x="44" y="110" fill="#AAB6C7" font-size="26" font-weight="500">
      Hi, I’m Jithendra Kantharaju.
    </text>

    <g fill="#E6EDF6" font-size="53" font-weight="700" letter-spacing="-2">
      <text x="44" y="171">Cloud infrastructure.</text>
      <text x="44" y="229">Reliable delivery.</text>
      <text x="44" y="287" fill="url(#accent)">Applied AI.</text>
    </g>
  </g>

  <path d="M606 49H670" stroke="#283440" stroke-width="2"/>
  <circle cx="606" cy="49" r="3" fill="#506070"/>
  <circle class="signal" cx="670" cy="49" r="4" fill="#7DE5F2"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg"
     width="760" height="128" viewBox="0 0 760 128"
     role="img" aria-labelledby="title">
  <title id="title">Code, build, deploy, and monitor</title>

  <defs>
    <linearGradient id="background" x2="100%" y2="100%">
      <stop stop-color="#080F24"/>
      <stop offset="1" stop-color="#1C1540"/>
    </linearGradient>
  </defs>

  <style>
    @media (prefers-reduced-motion: no-preference) {
      .signal {
        animation: travel 2.8s ease-in-out both;
      }
    }

    @keyframes travel {
      from { transform: translateX(0); }
      to { transform: translateX(570px); }
    }
  </style>

  <rect x="0.5" y="0.5" width="759" height="127" rx="17.5"
        fill="url(#background)" stroke="#375181"/>

  <path d="M95 47 H665" stroke="#375181" stroke-width="2"/>

  <g fill="#111D39" stroke="#A78BFA" stroke-width="2">
    <circle cx="95" cy="47" r="9"/>
    <circle cx="285" cy="47" r="9"/>
    <circle cx="475" cy="47" r="9"/>
  </g>
  <circle cx="665" cy="47" r="9"
          fill="#111D39" stroke="#32E6F2" stroke-width="2"/>
  <circle class="signal" cx="95" cy="47" r="4" fill="#32E6F2"/>

  <g fill="#ECF4FF" font-family="system-ui, sans-serif"
     font-size="25" font-weight="600" text-anchor="middle">
    <text x="95" y="95">Code</text>
    <text x="285" y="95">Build</text>
    <text x="475" y="95">Deploy</text>
    <text x="665" y="95">Monitor</text>
  </g>
</svg>
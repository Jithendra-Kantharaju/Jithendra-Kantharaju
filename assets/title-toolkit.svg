<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="125" viewBox="0 0 1200 125" role="img" aria-label="04 TOOLKIT. What I use to build and ship.">
<defs><linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080F22"/><stop offset=".56" stop-color="#111B37"/><stop offset="1" stop-color="#132745"/></linearGradient>
<linearGradient id="grad" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6EAFFC"/><stop offset=".55" stop-color="#5ACCEE"/><stop offset="1" stop-color="#6EAFFC"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#5ACCEE" stop-opacity=".23"/><stop offset="1" stop-color="#5ACCEE" stop-opacity="0"/></radialGradient>
<pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#6EAFFC" stroke-opacity=".055" fill="none"/></pattern>
</defs>
<style>
  .mono{font-family:ui-monospace,Consolas,Menlo,monospace}.ui{font-family:'Segoe UI',Arial,sans-serif}
  .text-in{animation:intro .85s cubic-bezier(.2,.9,.2,1) both}@keyframes intro{from{opacity:1;transform:translateY(11px)}to{opacity:1;transform:translateY(0)}}
  .moving{animation:float 6s ease-in-out infinite}@keyframes float{50%{transform:translateY(-6px)}}
  .stackspin{animation:stack 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes stack{50%{transform:rotate(18deg) scale(.88)}}.line-in{animation:line-in 1.4s ease both}@keyframes line-in{from{stroke-dashoffset:488}to{stroke-dashoffset:0}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.only-motion{display:none!important}}
</style>
<rect width="1200" height="125" rx="18" fill="url(#back)"/>
<rect width="1200" height="125" rx="18" fill="url(#g)"/>
<rect x=".8" y=".8" width="1198.4" height="123.4" rx="17.5" fill="none" stroke="#6EAFFC" stroke-opacity=".32"/>

<ellipse cx="1030" cy="66" rx="275" ry="124" fill="url(#halo)"/>
<rect x="0" y="0" width="7" height="125" rx="3" fill="url(#grad)"/>
<path d="M152 110 H1154" fill="none" stroke="#6EAFFC" stroke-opacity=".3" stroke-width="1"/>
<path d="M152 110 H640" fill="none" stroke="url(#grad)" stroke-width="3" stroke-dasharray="488" class="line-in"/>
<rect x="30" y="25" width="78" height="78" rx="22" fill="#0A1D35" stroke="#6EAFFC" stroke-opacity=".85" stroke-width="1.5"/>
<text x="69" y="74" text-anchor="middle" class="mono" font-size="31" font-weight="700" fill="#6EAFFC">04</text>
<text class="ui text-in" style="animation-delay:.12s" x="150" y="67" font-size="42" font-weight="800" fill="#F3F8FF">TOOLKIT</text>
<text class="ui text-in" style="animation-delay:.28s" x="152" y="96" font-size="17" fill="#B5C7E0">What I use to build and ship.</text>
<g transform="translate(1040 63)"><g class="stackspin"><path d="M0 -42 L52 -20 V15 L0 40 L-52 15 V-20Z" fill="none" stroke="#6EAFFC" stroke-width="2"/><path d="M0 -42 V0 L52 -20 M0 0 L-52 -20 M0 0 V40" fill="none" stroke="#5ACCEE" stroke-width="2"/></g><circle r="9" fill="#6EAFFC" opacity=".9"/></g>
